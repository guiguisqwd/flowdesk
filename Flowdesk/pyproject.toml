[project]
name = "workflow-workbench"
version = "0.1.0"
description = "Visual workbench for Python-led functional modules, locally and on Streamlit"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pydantic>=2.9,<3", "jsonschema>=4.23,<5", "markdown-it-py>=3,<5", "streamlit==1.65.0", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
